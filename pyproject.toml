[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xplore-installer"
version = "0.5.0"
description = "Installation support for Dräger X-plore 8300 in Service Connect"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/draegerwerk/xplore_installer"
Issues = "https://github.com/draegerwerk/xplore_installer/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xplore_installer"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/README.md", "/LICENSE"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --strict-config --strict-markers --import-mode=importlib --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
source = ["xplore_installer", "scripts"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
exclude_lines = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
